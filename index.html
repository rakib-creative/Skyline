:root{--ease:cubic-bezier(.22,.8,.24,1)}
body{--fg:#0c2236;--muted:#3b5870;--panel:rgba(255,255,255,.64);--line:rgba(12,34,54,.12);--accent:#0a63b0;--cloud:rgba(255,255,255,.75);--barbg:#5aaef2}
body[data-sky=night]{--fg:#eaf1ff;--muted:#a7b9d8;--panel:rgba(12,22,50,.62);--line:rgba(234,241,255,.16);--accent:#8fc2ff;--cloud:rgba(120,140,190,.25);--barbg:#070e24}
body[data-sky=cloud]{--cloud:rgba(255,255,255,.85);--barbg:#8fa3b5}
body[data-sky=rain]{--fg:#f2f8fd;--muted:#c3d2de;--panel:rgba(22,38,54,.62);--line:rgba(242,248,253,.18);--accent:#9ed0ff;--cloud:rgba(60,80,100,.55);--barbg:#36495b}
body[data-sky=storm]{--fg:#f2f8fd;--muted:#c3d2de;--panel:rgba(16,20,36,.66);--line:rgba(242,248,253,.18);--accent:#ffd36b;--cloud:rgba(40,46,70,.7);--barbg:#1c2238}
body[data-sky=snow]{--cloud:rgba(255,255,255,.8);--barbg:#a9c2da}
body[data-sky=fog]{--cloud:rgba(255,255,255,.8);--barbg:#a3acb3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;background:#5aaef2}
body{margin:0;min-height:100vh;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);line-height:1.5;
background:#5aaef2;
transition:color .6s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.orb{position:fixed;top:6vh;right:9vw;width:200px;height:200px;border-radius:50%;pointer-events:none;z-index:0;opacity:0;transition:opacity 1.2s,transform 1.2s var(--ease)}
body[data-sky=clear] .orb{opacity:1;background:radial-gradient(circle,#fffbe0 0 16%,rgba(255,226,130,.7) 34%,rgba(255,226,130,0) 68%);animation:breathe 7s ease-in-out infinite}
body[data-sky=night] .orb{opacity:1;width:84px;height:84px;top:9vh;background:#f3f6ff;box-shadow:0 0 70px 22px rgba(160,190,255,.32),inset -14px -8px 0 rgba(150,170,215,.35)}
.clouds i{position:fixed;left:-40vw;width:42vw;height:18vh;background:radial-gradient(closest-side,var(--cloud),transparent);pointer-events:none;z-index:0;animation:drift 90s linear infinite;will-change:transform}
.clouds i:nth-child(1){top:9vh}
.clouds i:nth-child(2){top:30vh;animation-duration:130s;animation-delay:-50s;height:11vh}
.clouds i:nth-child(3){top:52vh;animation-duration:110s;animation-delay:-80s;width:34vw}
.sky{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.sky.clear{background:linear-gradient(180deg,#5aaef2,#a9dcff 55%,#e4f4ff)}body[data-sky=clear] .sky.clear{opacity:1}
.sky.night{background:linear-gradient(180deg,#070e24,#142349 55%,#2b3d6b)}body[data-sky=night] .sky.night{opacity:1}
.sky.cloud{background:linear-gradient(180deg,#8fa3b5,#c3d0db 55%,#e6ecf1)}body[data-sky=cloud] .sky.cloud{opacity:1}
.sky.rain{background:linear-gradient(180deg,#36495b,#617789 55%,#8ea0ae)}body[data-sky=rain] .sky.rain{opacity:1}
.sky.storm{background:linear-gradient(180deg,#1c2238,#3d4564 55%,#656d8a)}body[data-sky=storm] .sky.storm{opacity:1}
.sky.snow{background:linear-gradient(180deg,#a9c2da,#d6e4f1 55%,#f6f9fc)}body[data-sky=snow] .sky.snow{opacity:1}
.sky.fog{background:linear-gradient(180deg,#a3acb3,#cdd2d6 55%,#eceeef)}body[data-sky=fog] .sky.fog{opacity:1}
body.nofx .clouds,body.nofx .orb{display:none}body.nofx #fxb{opacity:.5}
.dc{content-visibility:auto;contain-intrinsic-size:auto 112px}
@keyframes drift{to{transform:translateX(190vw)}}
@keyframes breathe{50%{transform:scale(1.07)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes shimmer{to{background-position:-200% 0}}
.app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 16px 56px}
.bar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;
background:var(--barbg);box-shadow:0 1px 0 var(--line)}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;margin-right:4px}
.search{position:relative;flex:1}
input,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;transition:border-color .2s,box-shadow .2s,background-color .6s}
input{width:100%}
input::placeholder{color:var(--muted)}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
select{max-width:100%}
select option{color:#0c2236;background:#fff}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 13px;transition:transform .2s var(--ease),border-color .2s,background-color .6s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.94)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:#fff;color:#0c2236;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,30,.28);overflow:hidden;display:none}
#sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;transition:background-color .15s}
#sugg button:hover,#sugg button:focus{background:#e6f1fb;outline:none}
#sugg small{color:#5a7287}
.tabs{position:relative;display:inline-flex;padding:4px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin:4px 0 14px}
.tabs button{position:relative;z-index:1;background:none;border:0;padding:8px 18px;border-radius:12px;font-weight:600;color:var(--muted);transition:color .3s}
.tabs button.on{color:var(--fg)}
.ind{position:absolute;top:4px;bottom:4px;left:0;border-radius:12px;background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.14),inset 0 0 0 1px var(--line);transition:transform .45s var(--ease),width .45s var(--ease)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:.85rem;transition:transform .2s var(--ease),border-color .2s}
.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:22px}
#out{transition:opacity .35s}
#out.busy{opacity:.5}
.intro>*{animation:rise .8s var(--ease) both;animation-delay:calc(var(--n,0)*70ms)}
.hero{padding:26px 4px 12px}
.place{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:600;color:var(--muted)}
.icon{background:none;border:0;font-size:1.35rem;line-height:1;padding:4px;color:var(--muted);transition:transform .3s var(--ease),color .2s}
.icon:hover{transform:scale(1.2) rotate(8deg)}
.icon.on{color:#f2b01e}
.temp{font-size:clamp(6.5rem,26vw,12rem);font-weight:200;line-height:.9;letter-spacing:-.06em;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.temp sup{font-size:.28em;font-weight:400;letter-spacing:0;vertical-align:top;position:relative;top:.55em;margin-left:.05em}
.cond{font-size:1.5rem;font-weight:600;display:flex;align-items:center;gap:10px}
.em{font-size:1.7rem}
.sub{color:var(--muted)}
h2{font-size:1.05rem;font-weight:800;margin:28px 0 10px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:10px;margin:18px 0}
.stat{padding:13px 15px;border-radius:16px}
.stat b{display:block;font-size:1.25rem;font-weight:800}
.stat span{color:var(--muted);font-size:.85rem}
.tips{padding:6px 16px}
.tip{display:flex;gap:12px;align-items:center;padding:10px 0}
.tip+.tip{border-top:1px solid var(--line)}
.tip span{font-size:1.4rem}
.curve{padding:14px 12px 4px}
.curve svg{display:block;width:100%;height:auto;overflow:visible}
.curve text{fill:var(--fg);font-size:11px;font-weight:600}
.hours{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 8px;scrollbar-width:thin;scroll-snap-type:x proximity}
.h{flex:0 0 68px;text-align:center;padding:10px 4px;border-radius:16px;scroll-snap-align:start}
.h div:first-child{font-size:.78rem;color:var(--muted)}
.h div:nth-child(2){font-size:1.45rem}
.h small{color:var(--accent);font-weight:600}
.aq{display:flex;gap:18px;align-items:center;padding:16px 18px}
.aqn{font-size:3rem;font-weight:200;line-height:1;min-width:84px;text-align:center}
.aq>div:last-child{flex:1}
.meter{position:relative;height:8px;border-radius:9px;margin-top:10px;background:linear-gradient(90deg,#2e9e57,#c9a100 22%,#e07b00 40%,#d63b3b 55%,#8e3fb0 75%,#7a1f3a)}
.meter i{position:absolute;top:-4px;width:6px;height:16px;border-radius:4px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);transform:translateX(-50%);transition:left .8s var(--ease)}
.days{padding:4px 0}
.d{display:grid;grid-template-columns:70px 28px 42px 34px 1fr 34px;gap:8px;align-items:center;padding:11px 16px}
.d+.d{border-top:1px solid var(--line)}
.d .rain{color:var(--accent);font-size:.82rem;font-weight:600}
.d .lo{color:var(--muted);text-align:right}
.d .hi{font-weight:800}
.track{position:relative;height:6px;border-radius:6px;background:var(--line)}
.track i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#5fb6ff,#ffb347,#ff6b4a)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.sm{padding:13px 15px;border-radius:18px;text-align:left;border:1px solid var(--line);transition:transform .25s var(--ease),border-color .2s}
.sm:hover{transform:translateY(-2px);border-color:var(--accent)}
.sm span{display:block;color:var(--muted);font-size:.85rem}
.sm b{font-size:1.15rem;font-weight:800}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input{flex:1 1 180px}
.bdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.dc{text-align:left;padding:12px 14px;border-radius:18px;border:1px solid var(--line);transition:transform .25s var(--ease),border-color .2s,background-color .6s}
.dc:hover{transform:translateY(-3px);border-color:var(--accent)}
.dc b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc small{color:var(--muted)}
.dc .big{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px}
.dc .big span:last-child{font-size:2rem;font-weight:200;letter-spacing:-.04em}
.dc .big span:first-child{font-size:1.5rem}
.sk{height:380px;border-radius:26px;background:linear-gradient(100deg,var(--panel) 30%,rgba(255,255,255,.28) 50%,var(--panel) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border:1px solid var(--line)}
.sk.s{height:104px;border-radius:18px;animation-delay:calc(var(--n,0)*60ms)}
#msg{margin:28px 0;font-weight:600}
#msg button{margin-left:8px;padding:6px 14px}
footer{margin-top:40px;font-size:.8rem;color:var(--muted)}
footer a{color:inherit}
@media(max-width:520px){.brand{display:none}.d{grid-template-columns:58px 26px 38px 30px 1fr 30px;padding:11px 12px}.orb{right:2vw;width:150px;height:150px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

const cv=$("fx"),cx=cv.getContext("2d");let W=0,H=0,P=[],mode="clear",flash=0,raf=0;
const DPR=1,LOW=(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=4;
function seed(){if(!S.fx){P=[];return}const n=Math.round(({rain:80,storm:110,snow:70,night:60}[mode]||0)*(LOW?.5:1));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,v:Math.random(),r:Math.random()}))}
function size(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);seed();moveInd()}
function fx(m){mode=m;seed();if(!raf)raf=requestAnimationFrame(tick)}
function tick(t){
  raf=0;cx.clearRect(0,0,W,H);
  if(!P.length)return;
  if(mode==="rain"||mode==="storm"){cx.strokeStyle="rgba(205,228,255,.5)";cx.lineWidth=1.2;cx.beginPath();
    for(const p of P){const l=10+p.v*16;cx.moveTo(p.x,p.y);cx.lineTo(p.x-l*.15,p.y+l);if(!RM){p.y+=9+p.v*11;p.x-=1.4;if(p.y>H){p.y=-30;p.x=Math.random()*W+40}}}cx.stroke()}
  else if(mode==="snow"){cx.fillStyle="rgba(255,255,255,.9)";
    for(const p of P){cx.beginPath();cx.arc(p.x+Math.sin(t/1200+p.r*9)*14,p.y,1.4+p.r*2.4,0,7);cx.fill();if(!RM){p.y+=.6+p.v*1.2;if(p.y>H+6){p.y=-6;p.x=Math.random()*W}}}}
  else if(mode==="night"){for(const p of P){cx.fillStyle=`rgba(255,255,255,${.25+.75*Math.abs(Math.sin(t/1100+p.r*12))})`;cx.fillRect(p.x,p.y*.7,1+p.r*1.6,1+p.r*1.6)}}
  if(mode==="storm"&&!RM){if(Math.random()<.006)flash=1;if(flash>.02){cx.fillStyle=`rgba(255,255,255,${flash*.35})`;cx.fillRect(0,0,W,H);flash*=.86}}
  if(!RM&&!document.hidden)raf=requestAnimationFrame(tick);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!raf)raf=requestAnimationFrame(tick)});
const BAR={clear:"#5aaef2",night:"#070e24",cloud:"#8fa3b5",rain:"#36495b",storm:"#1c2238",snow:"#a9c2da",fog:"#a3acb3"};
function setSky(sky,isDay){const k=(!isDay&&(sky==="clear"||sky==="cloud"))?"night":sky;document.body.dataset.sky=k;
  const c=BAR[k]||BAR.clear,m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",c);
  document.documentElement.style.background=c;fx(k)}

/* ---------- helpers ---------- */
const AQ=a=>a<=50?["Good","#2e9e57"]:a<=100?["Moderate","#b58d00"]:a<=150?["Unhealthy for sensitive groups","#e07b00"]:a<=200?["Unhealthy","#d63b3b"]:a<=300?["Very unhealthy","#8e3fb0"]:["Hazardous","#7a1f3a"];
const DIR=["N","NE","E","SE","S","SW","W","NW"];
function curve(vals,times){
  const Wd=480,Ht=112,pad=22,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[i*Wd/(vals.length-1),pad+(1-(v-mn)/r)*(Ht-pad*1.6)]);
  let d="M"+pts[0];for(let i=1;i<pts.length;i++){const m=[(pts[i-1][0]+pts[i][0])/2,(pts[i-1][1]+pts[i][1])/2];d+=` Q${pts[i-1]} ${m}`}
  d+=` L${pts.at(-1)}`;
  let lab="";pts.forEach((p,i)=>{if(i%4===0||i===pts.length-1){const a=i===0?"start":i===pts.length-1?"end":"middle";
    lab+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--accent)"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="${a}">${Math.round(vals[i])}°</text>`}});
  return `<svg viewBox="0 0 ${Wd} ${Ht+4}" role="img" aria-label="Temperature curve for the next 24 hours"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
  <path d="${d} L${Wd},${Ht+4} L0,${Ht+4} Z" fill="url(#cg)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>${lab}</svg>`;
}
let prevT=null;
function countUp(el,from,to){if(RM||from===null||from===to){el.textContent=to;return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}

let first=true,token=0;
async function load(silent){
  const p=S.place,im=S.imp,id=++token;
  if(first){$("sk").hidden=false;$("out").hidden=true;$("msg").hidden=true}else if(!silent)$("out").classList.add("busy");
  const u="&temperature_unit="+(im?"fahrenheit":"celsius")+"&wind_speed_unit="+(im?"mph":"kmh")+"&precipitation_unit="+(im?"inch":"mm");
  const wu="https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon+
   "&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,cloud_cover"+
   "&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,is_day"+
   "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max"+
   "&timezone=auto&forecast_days=7"+u;
  const au="https://air-quality-api.open-meteo.com/v1/air-quality?latitude="+p.lat+"&longitude="+p.lon+"&current=us_aqi,pm2_5,pm10&timezone=auto";
  try{
    const [wr,ar]=await Promise.allSettled([fetch(wu),fetch(au)]);
    if(wr.status!=="fulfilled"||!wr.value.ok)throw 0;
    const w=await wr.value.json();let aq=null;
    if(ar.status==="fulfilled"&&ar.value.ok)try{aq=(await ar.value.json()).current}catch{}
    if(id!==token)return;
    render(w,aq);
  }catch{
    if(id!==token)return;
    $("sk").hidden=true;$("out").classList.remove("busy");
    if(first)$("out").hidden=true;
    $("msg").hidden=false;
    $("msg").innerHTML="Couldn't load live weather. Open this file in Chrome or Safari (not a chat or file preview), check your internet, then <button class=\"btn\" id=\"retry\">Retry</button>";
    $("retry").onclick=()=>load();
  }
}

function render(w,aq){
  const p=S.place,c=w.current,im=S.imp,deg=im?"°F":"°C",[label,,sky]=info(c.weather_code),dl=w.daily;
  setSky(sky,c.is_day);
  const start=Math.max(0,w.hourly.time.findIndex(t=>t>=c.time.slice(0,13)+":00")),H24=w.hourly.time.slice(start,start+24);
  const sl=(a)=>a.slice(start,start+24);
  const rain24=sl(w.hourly.precipitation).reduce((a,b)=>a+(b||0),0);
  const uv=Math.round(dl.uv_index_max[0]);
  const isFav=FAVS.some(f=>same(f,p));
  const tc=im?(c.apparent_temperature-32)*5/9:c.apparent_temperature,wk=im?c.wind_speed_10m*1.609:c.wind_speed_10m;
  const rainMax=Math.max(0,...sl(w.hourly.precipitation_probability).slice(0,12).map(x=>x||0));
  const tips=[];
  if(rainMax>=50)tips.push(["☂️","Carry an umbrella. Rain is likely in the next 12 hours."]);
  if(uv>=8)tips.push(["🧴","UV is very high today. Use sunscreen and stay in the shade around midday."]);
  else if(uv>=6)tips.push(["🕶️","UV is high today. Sunglasses and sunscreen are a good idea."]);
  if(tc>=36)tips.push(["💧","It feels very hot. Drink water often and avoid long time in the sun."]);
  else if(tc<=10)tips.push(["🧥","It feels cold. Wear a warm jacket."]);
  if(wk>=40)tips.push(["💨","Strong wind today. Secure loose items outside."]);
  if(aq&&aq.us_aqi>150)tips.push(["😷","Air quality is poor. Consider a mask outdoors."]);
  if(!tips.length)tips.push(["😊","Conditions look comfortable. Enjoy your day."]);
  const aqL=aq?AQ(aq.us_aqi):null;
  const lo=Math.min(...dl.temperature_2m_min),hi=Math.max(...dl.temperature_2m_max),span=hi-lo||1;
  const stats=[["Humidity",c.relative_humidity_2m+"%"],
    ["Wind",`<span style="display:inline-block;transform:rotate(${c.wind_direction_10m+180}deg)">↑</span> ${Math.round(c.wind_speed_10m)} ${im?"mph":"km/h"} ${DIR[Math.round(c.wind_direction_10m/45)%8]}`],
    ["Pressure",Math.round(c.pressure_msl)+" hPa"],["UV index",uv],["Cloud cover",c.cloud_cover+"%"],
    ["Rain, next 24h",rain24.toFixed(im?2:1)+(im?" in":" mm")],["Sunrise",t12(dl.sunrise[0],1)],["Sunset",t12(dl.sunset[0],1)]];
  const o=$("out");
  o.innerHTML=`
  <div class="hero">
    <div class="place"><span>${flag(p.cc)} ${esc(p.name)}${p.country?", "+esc(p.country):""}</span><button id="fav" class="icon ${isFav?"on":""}" aria-label="Save this place" title="Save this place">${isFav?"★":"☆"}</button></div>
    <div class="temp"><span id="tn">${Math.round(c.temperature_2m)}</span><sup>${deg}</sup></div>
    <div class="cond"><span class="em">${icon(c.weather_code,c.is_day)}</span>${label}</div>
    <div class="sub">High ${Math.round(dl.temperature_2m_max[0])}° · Low ${Math.round(dl.temperature_2m_min[0])}° · Feels like ${Math.round(c.apparent_temperature)}${deg}</div>
    <div class="sub">Updated ${t12(c.time,1)} local time</div>
  </div>
  <div class="grid">${stats.map(s=>`<div class="stat glass"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("")}</div>
  <div class="tips glass">${tips.map(t=>`<div class="tip"><span>${t[0]}</span><div>${t[1]}</div></div>`).join("")}</div>
  <h2>Next 24 hours</h2>
  <div class="curve glass">${curve(sl(w.hourly.temperature_2m))}</div>
  <div class="hours">${H24.map((t,i)=>{const k=start+i;return `<div class="h glass"><div>${i?t12(t):"Now"}</div><div>${icon(w.hourly.weather_code[k],w.hourly.is_day[k])}</div><div>${Math.round(w.hourly.temperature_2m[k])}°</div><small>${w.hourly.precipitation_probability[k]??0}%</small></div>`}).join("")}</div>
  ${aq?`<h2>Air quality</h2><div class="aq glass"><div class="aqn" style="color:${aqL[1]}">${Math.round(aq.us_aqi)}</div><div><b>${aqL[0]}</b><div class="sub">PM2.5 ${Math.round(aq.pm2_5)} · PM10 ${Math.round(aq.pm10)} µg/m³</div><div class="meter"><i style="left:${Math.min(aq.us_aqi,300)/3}%"></i></div></div></div>`:""}
  <h2>7-day forecast</h2>
  <div class="days glass">${dl.time.map((d,i)=>{const n=i?new Date(d+"T12:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric"}):"Today";
    const a=dl.temperature_2m_min[i],b=dl.temperature_2m_max[i];
    return `<div class="d"><div>${n}</div><div>${icon(dl.weather_code[i])}</div><div class="rain">${dl.precipitation_probability_max[i]??0}%</div><div class="lo">${Math.round(a)}°</div><div class="track"><i style="left:${(a-lo)/span*100}%;width:${Math.max(6,(b-a)/span*100)}%"></i></div><div class="hi">${Math.round(b)}°</div></div>`}).join("")}</div>`;
  const nt=Math.round(c.temperature_2m);countUp($("tn"),prevT,nt);prevT=nt;

  if(first){first=false;[...o.children].forEach((ch,i)=>ch.style.setProperty("--n",i));o.classList.add("intro");setTimeout(()=>o.classList.remove("intro"),1800)}
  document.title=nt+deg+" in "+p.name+" · Skyline Weather";

    const r=await fetch(url);if(!r.ok)throw 0;
    const j=await r.json(),arr=Array.isArray(j)?j:[j];
    BDD={t:Date.now(),imp:S.imp,time:arr[0].current.time,rows:BD.map((d,i)=>({...d,i,t:arr[i].current.temperature_2m,code:arr[i].current.weather_code,day:arr[i].current.is_day,hi:arr[i].daily.temperature_2m_max[0],lo:arr[i].daily.temperature_2m_min[0],rain:arr[i].daily.precipitation_probability_max[0]??0}))};
    drawBD();
  }catch{
    $("bdgrid").innerHTML=`<p id="msg2">Couldn't load district weather. Open this file in Chrome or Safari, then <button class="btn" id="bdretry">Retry</button></p>`;
    $("bdretry").onclick=()=>loadBD(true);
  }
}
function drawBD(){
  const R=BDD.rows,deg=S.imp?"°F":"°C";
  const hot=[...R].sort((a,b)=>b.t-a.t)[0],cold=[...R].sort((a,b)=>a.t-b.t)[0],wet=[...R].sort((a,b)=>b.rain-a.rain)[0];
  const avg=R.reduce((a,b)=>a+b.t,0)/R.length;
  $("bdsum").innerHTML=[["Hottest now",hot.n,Math.round(hot.t)+deg,hot],["Coldest now",cold.n,Math.round(cold.t)+deg,cold],["Most rain chance today",wet.n,wet.rain+"%",wet],["Bangladesh average",Math.round(avg)+deg,"across 64 districts",null]]
    .map(s=>`<button class="sm glass" ${s[3]?`data-i="${s[3].i}"`:"disabled"}><span>${s[0]}</span><b>${esc(s[1])}</b> <span style="display:inline">${esc(s[2])}</span></button>`).join("");
  let L=R.filter(d=>(bdDiv==="All"||d.div===bdDiv)&&d.n.toLowerCase().includes(bdQ));
  L.sort(bdSort==="hot"?(a,b)=>b.t-a.t:bdSort==="cold"?(a,b)=>a.t-b.t:bdSort==="rain"?(a,b)=>b.rain-a.rain||b.t-a.t:(a,b)=>a.n.localeCompare(b.n));
  $("bdinfo").textContent=`${L.length} district${L.length===1?"":"s"} · Updated ${t12(BDD.time,1)} Dhaka time`;
  $("bdgrid").innerHTML=L.length?L.map((d,k)=>`<button class="dc glass" data-i="${d.i}"><b>${esc(d.n)}</b><small>${d.div}</small><div class="big"><span>${icon(d.code,d.day)}</span><span>${Math.round(d.t)}°</span></div><small>H ${Math.round(d.hi)}° L ${Math.round(d.lo)}° · 💧 ${d.rain}%</small></button>`).join(""):`<p class="sub">No district matches that name.</p>`;
}
$("bddiv").innerHTML=["All",...Object.keys(BD_RAW)].map(d=>`<button class="chip" data-d="${d}">${d}</button>`).join("");
$("bddiv").onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;bdDiv=b.dataset.d;$$("#bddiv .chip").forEach(x=>x.style.borderColor=x===b?"var(--accent)":"");if(BDD)drawBD()};
$$("#bddiv .chip")[0].style.borderColor="var(--accent)";
let bdT;$("bdq").oninput=e=>{clearTimeout(bdT);const v=e.target.value.trim().toLowerCase();bdT=setTimeout(()=>{bdQ=v;if(BDD)drawBD()},140)};
$("bdsort").onchange=e=>{bdSort=e.target.value;if(BDD)drawBD()};
const openDistrict=e=>{const b=e.target.closest("[data-i]");if(b&&!b.disabled)pick(bdPlace(BD[+b.dataset.i]))};
$("bdgrid").onclick=openDistrict;$("bdsum").onclick=openDistrict;

/* ---------- navigation, search, saved ---------- */
function moveInd(){const b=document.querySelector(".tabs button.on"),i=$("ind");if(b){i.style.width=b.offsetWidth+"px";i.style.transform=`translateX(${b.offsetLeft}px)`}}
function show(t){S.tab=t;$("tw").hidden=t!=="w";$("tbd").hidden=t!=="bd";
  $$(".tabs button").forEach(b=>{const on=b.dataset.tab===t;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});
  moveInd();scrollTo({top:0,behavior:RM?"auto":"smooth"});if(t==="bd")loadBD()}
$$(".tabs button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
const hideSugg=()=>$("sugg").style.display="none";
function pick(p){S.place=p;store.set("place",p);$("q").value="";hideSugg();$("cs").value="";show("w");load()}
const pickC=c=>pick({name:c.cap,country:c.name,cc:c.cc,lat:c.lat,lon:c.lon});

function chips(){
  const sv=FAVS.map((f,i)=>`<button class="chip" data-f="${i}">★ ${esc(f.name)}</button>`).join("");
  const bd=["Dhaka","Chattogram","Sylhet","Rajshahi","Khulna","Barishal","Rangpur","Mymensingh"].map(n=>`<button class="chip" data-b="${n}">🇧🇩 ${n}</button>`).join("");
  $("chips").innerHTML=(sv?`<div class="row">${sv}</div>`:"")+`<div class="row">${bd}</div>`;
}
$("chips").onclick=e=>{const f=e.target.closest("[data-f]"),b=e.target.closest("[data-b]");
  if(f)pick(FAVS[+f.dataset.f]);else if(b)pick(bdPlace(BD.find(d=>d.n===b.dataset.b)))};
$("out").addEventListener("click",e=>{if(!e.target.closest("#fav"))return;
  const i=FAVS.findIndex(f=>same(f,S.place));if(i>=0)FAVS.splice(i,1);else FAVS.unshift({...S.place});
  FAVS=FAVS.slice(0,8);store.set("fav",FAVS);chips();
  const on=FAVS.some(f=>same(f,S.place)),b=$("fav");b.textContent=on?"★":"☆";b.classList.toggle("on",on)});

let timer;
$("q").addEventListener("input",e=>{
  clearTimeout(timer);const v=e.target.value.trim(),lv=v.toLowerCase();
  if(v.length<2){hideSugg();return}
  const dm=BD.filter(d=>d.n.toLowerCase().includes(lv)).slice(0,3),cm=CL.filter(c=>c.name.toLowerCase().includes(lv)).slice(0,3);
  const draw=res=>{
    const h=dm.map((d,i)=>`<button data-d="${i}">🇧🇩 ${esc(d.n)} <small>${d.div} division, Bangladesh</small></button>`).join("")+
      cm.map((c,i)=>`<button data-c="${i}">${flag(c.cc)} ${esc(c.name)} <small>capital: ${esc(c.cap)}</small></button>`).join("")+
      res.map((x,i)=>`<button data-i="${i}">${flag(x.country_code)} ${esc(x.name)} <small>${esc([x.admin1,x.country].filter(Boolean).join(", "))}</small></button>`).join("");
    $("sugg").innerHTML=h||`<button disabled>No places found. Try another spelling.</button>`;$("sugg").style.display="block";
    $$("button[data-d]",$("sugg")).forEach(b=>b.onclick=()=>pick(bdPlace(dm[b.dataset.d])));
    $$("button[data-c]",$("sugg")).forEach(b=>b.onclick=()=>pickC(cm[b.dataset.c]));
    $$("button[data-i]",$("sugg")).forEach(b=>b.onclick=()=>{const x=res[b.dataset.i];pick({name:x.name,country:x.country||"",cc:x.country_code,lat:x.latitude,lon:x.longitude})});
  };
  if(dm.length||cm.length)draw([]);
  timer=setTimeout(async()=>{try{const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&format=json&name="+encodeURIComponent(v));draw(((await r.json()).results||[]).filter(x=>x.country_code!=="IL"&&x.country!=="Israel"))}catch{if(!dm.length&&!cm.length)draw([])}},250);
});
$("q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){const b=$("sugg").querySelector("button:not([disabled])");if(b)b.click()}
  if(e.key==="Escape")hideSugg();
  if(e.key==="ArrowDown"){const b=$("sugg").querySelector("button");if(b){e.preventDefault();b.focus()}}});
$("sugg").addEventListener("keydown",e=>{const b=$$("button",$("sugg")),i=b.indexOf(document.activeElement);
  if(e.key==="ArrowDown"&&b[i+1]){e.preventDefault();b[i+1].focus()}
  if(e.key==="ArrowUp"){e.preventDefault();(b[i-1]||$("q")).focus()}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))hideSugg()});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("q").focus()}});

$("loc").onclick=()=>{
  const m=t=>{show("w");$("sk").hidden=true;$("msg").hidden=false;$("msg").textContent=t};
  if(!navigator.geolocation)return m("Location isn't supported in this browser.");
  navigator.geolocation.getCurrentPosition(pos=>pick({name:"Your location",country:"",cc:"",lat:pos.coords.latitude,lon:pos.coords.longitude}),
    ()=>m("Location is blocked. Allow it in your browser settings, or search for a place."),{timeout:10000});
};
$("unit").onclick=()=>{S.imp=!S.imp;store.set("imp",S.imp);$("unit").textContent=S.imp?"°F":"°C";prevT=null;BDD=null;S.tab==="bd"?loadBD():load()};
$("unit").textContent=S.imp?"°F":"°C";
$("fxb").onclick=()=>{S.fx=!S.fx;store.set("fx",S.fx);document.body.classList.toggle("nofx",!S.fx);fx(mode)};
$("cs").innerHTML+=CL.map((c,i)=>`<option value="${i}">${flag(c.cc)} ${esc(c.name)}</option>`).join("");
$("cs").onchange=e=>{if(e.target.value!=="")pickC(CL[e.target.value])};

let rzT;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(size,150)});
if(document.fonts)document.fonts.ready.then(moveInd);
setInterval(()=>{if(!document.hidden&&S.tab==="w"&&!first)load(true)},6e5);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
chips();size();fx("clear");load();
</script>
</body>
</html>
