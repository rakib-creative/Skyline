<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5aaef2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skyline">
<title>Skyline Weather – every country, every district of Bangladesh</title>
<meta name="description" content="Free live weather for any place in the world, plus all 64 districts of Bangladesh.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.22,.8,.24,1)}
body{--fg:#0c2236;--muted:#3b5870;--panel:rgba(255,255,255,.64);--line:rgba(12,34,54,.12);--accent:#0a63b0;--cloud:rgba(255,255,255,.75);--barbg:#5aaef2}
body[data-sky=night]{--fg:#eaf1ff;--muted:#a7b9d8;--panel:rgba(12,22,50,.62);--line:rgba(234,241,255,.16);--accent:#8fc2ff;--cloud:rgba(120,140,190,.25);--barbg:#070e24}
body[data-sky=cloud]{--cloud:rgba(255,255,255,.85);--barbg:#8fa3b5}
body[data-sky=rain]{--fg:#f2f8fd;--muted:#c3d2de;--panel:rgba(22,38,54,.62);--line:rgba(242,248,253,.18);--accent:#9ed0ff;--cloud:rgba(60,80,100,.55);--barbg:#36495b}
body[data-sky=storm]{--fg:#f2f8fd;--muted:#c3d2de;--panel:rgba(16,20,36,.66);--line:rgba(242,248,253,.18);--accent:#ffd36b;--cloud:rgba(40,46,70,.7);--barbg:#1c2238}
body[data-sky=snow]{--cloud:rgba(255,255,255,.8);--barbg:#a9c2da}
body[data-sky=fog]{--cloud:rgba(255,255,255,.8);--barbg:#a3acb3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;background:#5aaef2}
body{margin:0;min-height:100vh;font-family:Manrope,"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);line-height:1.5;
background:#5aaef2;
transition:color .6s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.orb{position:fixed;top:6vh;right:9vw;width:200px;height:200px;border-radius:50%;pointer-events:none;z-index:0;opacity:0;transition:opacity 1.2s,transform 1.2s var(--ease)}
body[data-sky=clear] .orb{opacity:1;background:radial-gradient(circle,#fffbe0 0 16%,rgba(255,226,130,.7) 34%,rgba(255,226,130,0) 68%);animation:breathe 7s ease-in-out infinite}
body[data-sky=night] .orb{opacity:1;width:84px;height:84px;top:9vh;background:#f3f6ff;box-shadow:0 0 70px 22px rgba(160,190,255,.32),inset -14px -8px 0 rgba(150,170,215,.35)}
.clouds i{position:fixed;left:-40vw;width:42vw;height:18vh;background:radial-gradient(closest-side,var(--cloud),transparent);pointer-events:none;z-index:0;animation:drift 90s linear infinite;will-change:transform}
.clouds i:nth-child(1){top:9vh}
.clouds i:nth-child(2){top:30vh;animation-duration:130s;animation-delay:-50s;height:11vh}
.clouds i:nth-child(3){top:52vh;animation-duration:110s;animation-delay:-80s;width:34vw}
.sky{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.sky.clear{background:linear-gradient(180deg,#5aaef2,#a9dcff 55%,#e4f4ff)}body[data-sky=clear] .sky.clear{opacity:1}
.sky.night{background:linear-gradient(180deg,#070e24,#142349 55%,#2b3d6b)}body[data-sky=night] .sky.night{opacity:1}
.sky.cloud{background:linear-gradient(180deg,#8fa3b5,#c3d0db 55%,#e6ecf1)}body[data-sky=cloud] .sky.cloud{opacity:1}
.sky.rain{background:linear-gradient(180deg,#36495b,#617789 55%,#8ea0ae)}body[data-sky=rain] .sky.rain{opacity:1}
.sky.storm{background:linear-gradient(180deg,#1c2238,#3d4564 55%,#656d8a)}body[data-sky=storm] .sky.storm{opacity:1}
.sky.snow{background:linear-gradient(180deg,#a9c2da,#d6e4f1 55%,#f6f9fc)}body[data-sky=snow] .sky.snow{opacity:1}
.sky.fog{background:linear-gradient(180deg,#a3acb3,#cdd2d6 55%,#eceeef)}body[data-sky=fog] .sky.fog{opacity:1}
body.nofx .clouds,body.nofx .orb{display:none}body.nofx #fxb{opacity:.5}
.dc{content-visibility:auto;contain-intrinsic-size:auto 112px}
@keyframes drift{to{transform:translateX(190vw)}}
@keyframes breathe{50%{transform:scale(1.07)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes shimmer{to{background-position:-200% 0}}
.app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 16px 56px}
.bar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;
background:transparent}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;margin-right:4px}
.search{position:relative;flex:1}
input,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;transition:border-color .2s,box-shadow .2s,background-color .6s}
input{width:100%}
input::placeholder{color:var(--muted)}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
select{max-width:100%}
select option{color:#0c2236;background:#fff}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 13px;transition:transform .2s var(--ease),border-color .2s,background-color .6s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.94)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:#fff;color:#0c2236;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,30,.28);overflow:hidden;display:none}
#sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;transition:background-color .15s}
#sugg button:hover,#sugg button:focus{background:#e6f1fb;outline:none}
#sugg small{color:#5a7287}
.tabs{position:relative;display:flex;width:fit-content;margin-left:auto;margin-right:auto;padding:4px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-top:2px;margin-bottom:4px}
.tabs button{position:relative;z-index:1;background:none;border:0;padding:8px 18px;border-radius:12px;font-weight:600;color:var(--muted);transition:color .3s}
.tabs button.on{color:var(--fg)}
.ind{position:absolute;top:4px;bottom:4px;left:0;border-radius:12px;background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.14),inset 0 0 0 1px var(--line);transition:transform .45s var(--ease),width .45s var(--ease)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:.85rem;transition:transform .2s var(--ease),border-color .2s}
.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:22px}
#out{transition:opacity .35s}
#out.busy{opacity:.5}
.intro>*{animation:rise .8s var(--ease) both;animation-delay:calc(var(--n,0)*70ms)}
.hero{padding:12px 4px 12px}
.place{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:600;color:var(--muted)}
.icon{background:none;border:0;font-size:1.35rem;line-height:1;padding:4px;color:var(--muted);transition:transform .3s var(--ease),color .2s}
.icon:hover{transform:scale(1.2) rotate(8deg)}
.icon.on{color:#f2b01e}
.temp{font-size:clamp(6.5rem,26vw,12rem);font-weight:200;line-height:.9;letter-spacing:-.06em;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.temp sup{font-size:.28em;font-weight:400;letter-spacing:0;vertical-align:top;position:relative;top:.55em;margin-left:.05em}
.cond{font-size:1.5rem;font-weight:600;display:flex;align-items:center;gap:10px}
.em{font-size:1.7rem}
.sub{color:var(--muted)}
h2{font-size:1.05rem;font-weight:800;margin:28px 0 10px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:10px;margin:18px 0}
.stat{padding:13px 15px;border-radius:16px}
.stat b{display:block;font-size:1.25rem;font-weight:800}
.stat span{color:var(--muted);font-size:.85rem}
.tips{padding:6px 16px}
.tip{display:flex;gap:12px;align-items:center;padding:10px 0}
.tip+.tip{border-top:1px solid var(--line)}
.tip span{font-size:1.4rem}
.curve{padding:14px 12px 4px}
.curve svg{display:block;width:100%;height:auto;overflow:visible}
.curve text{fill:var(--fg);font-size:11px;font-weight:600}
.hours{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 8px;scrollbar-width:thin;scroll-snap-type:x proximity}
.h{flex:0 0 68px;text-align:center;padding:10px 4px;border-radius:16px;scroll-snap-align:start}
.h div:first-child{font-size:.78rem;color:var(--muted)}
.h div:nth-child(2){font-size:1.45rem}
.h small{color:var(--accent);font-weight:600}
.aq{display:flex;gap:18px;align-items:center;padding:16px 18px}
.aqn{font-size:3rem;font-weight:200;line-height:1;min-width:84px;text-align:center}
.aq>div:last-child{flex:1}
.meter{position:relative;height:8px;border-radius:9px;margin-top:10px;background:linear-gradient(90deg,#2e9e57,#c9a100 22%,#e07b00 40%,#d63b3b 55%,#8e3fb0 75%,#7a1f3a)}
.meter i{position:absolute;top:-4px;width:6px;height:16px;border-radius:4px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);transform:translateX(-50%);transition:left .8s var(--ease)}
.days{padding:4px 0}
.d{display:grid;grid-template-columns:88px 28px 42px 34px 1fr 34px;gap:8px;align-items:center;padding:11px 16px}
.d+.d{border-top:1px solid var(--line)}
.d>div:first-child{white-space:nowrap}
.d .rain{color:var(--accent);font-size:.82rem;font-weight:600}
.d .lo{color:var(--muted);text-align:right}
.d .hi{font-weight:800}
.track{position:relative;height:6px;border-radius:6px;background:var(--line)}
.track i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#5fb6ff,#ffb347,#ff6b4a)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.sm{padding:13px 15px;border-radius:18px;text-align:left;border:1px solid var(--line);transition:transform .25s var(--ease),border-color .2s}
.sm:hover{transform:translateY(-2px);border-color:var(--accent)}
.sm span{display:block;color:var(--muted);font-size:.85rem}
.sm b{font-size:1.15rem;font-weight:800}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input{flex:1 1 180px}
.bdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.dc{text-align:left;padding:12px 14px;border-radius:18px;border:1px solid var(--line);transition:transform .25s var(--ease),border-color .2s,background-color .6s}
.dc:hover{transform:translateY(-3px);border-color:var(--accent)}
.dc b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc small{color:var(--muted)}
.dc .big{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px}
.dc .big span:last-child{font-size:2rem;font-weight:200;letter-spacing:-.04em}
.dc .big span:first-child{font-size:1.5rem}
.sk{height:380px;border-radius:26px;background:linear-gradient(100deg,var(--panel) 30%,rgba(255,255,255,.28) 50%,var(--panel) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border:1px solid var(--line)}
.sk.s{height:104px;border-radius:18px;animation-delay:calc(var(--n,0)*60ms)}
#msg{margin:28px 0;font-weight:600}
#msg button{margin-left:8px;padding:6px 14px}
footer{margin-top:40px;font-size:.8rem;color:var(--muted)}
footer a{color:inherit}
@media(max-width:520px){.brand{display:none}.d{grid-template-columns:80px 26px 38px 30px 1fr 30px;padding:11px 12px}.orb{right:2vw;width:150px;height:150px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ---- v3 additions ---- */
.sky.dusk{background:linear-gradient(180deg,#3d3b7a,#c2658a 55%,#ffb37a)}body[data-sky=dusk] .sky.dusk{opacity:1}
body[data-sky=dusk]{--fg:#fff7ef;--muted:#f1d9d0;--panel:rgba(48,28,64,.5);--line:rgba(255,247,239,.2);--accent:#ffd08a;--cloud:rgba(255,190,150,.42);--barbg:#3d3b7a}
body[data-sky=dusk] .orb{opacity:1;top:24vh;background:radial-gradient(circle,#fff0c8 0 14%,rgba(255,150,90,.78) 34%,rgba(255,120,80,0) 68%);animation:breathe 7s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-70%;border-radius:50%;opacity:0;transition:opacity 1.2s;
background:repeating-conic-gradient(from 0deg,rgba(255,240,170,.20) 0 5deg,transparent 5deg 20deg);
-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 66%);mask-image:radial-gradient(circle,#000 18%,transparent 66%);animation:spin 70s linear infinite}
body[data-sky=clear] .orb::before,body[data-sky=dusk] .orb::before{opacity:1}
body.hot .orb{width:240px;height:240px}
@keyframes spin{to{transform:rotate(360deg)}}
.heat{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.5s;background:linear-gradient(180deg,transparent 35%,rgba(255,140,50,.18))}
body.hot .heat{opacity:1}
.clouds{opacity:var(--co,.85);transition:opacity 1.5s}
.clouds i{animation-duration:var(--cd,90s)}
.clouds i:nth-child(2){animation-duration:calc(var(--cd,90s)*1.45)}
.clouds i:nth-child(3){animation-duration:calc(var(--cd,90s)*1.2)}
.clouds i:nth-child(4){top:70vh;width:30vw;height:12vh;animation-duration:calc(var(--cd,90s)*1.7);animation-delay:-20s}
.fog i{position:fixed;left:-30vw;width:160vw;height:28vh;background:radial-gradient(closest-side,rgba(255,255,255,.6),transparent);opacity:0;transition:opacity 1.5s;pointer-events:none;z-index:0;animation:fogdrift 45s ease-in-out infinite alternate;will-change:transform}
.fog i:nth-child(1){top:34vh}
.fog i:nth-child(2){top:60vh;animation-duration:62s;animation-direction:alternate-reverse}
body[data-sky=fog] .fog i{opacity:.9}
body[data-sky=rain] .fog i,body[data-sky=storm] .fog i{opacity:.18}
@keyframes fogdrift{to{transform:translateX(18vw)}}
body[data-sky=night] .clouds{opacity:.35}

.alert{display:flex;gap:12px;align-items:center;padding:13px 16px;border-radius:18px;margin:6px 0 4px;color:#fff;font-weight:700;line-height:1.35;box-shadow:0 6px 22px rgba(0,0,0,.18);animation:alertin .7s var(--ease) both}
.alert .ai{font-size:1.7rem;animation:wob 2.4s ease-in-out infinite}
.alert.soon{background:linear-gradient(90deg,#1b6fd1,#3aa0ff)}
.alert.now{background:linear-gradient(90deg,#0b4fae,#1b84e6)}
.alert.storm{background:linear-gradient(90deg,#5b2bb0,#d6453d)}
@keyframes alertin{from{opacity:0;transform:translateY(-8px) scale(.98)}}
@keyframes wob{50%{transform:rotate(-9deg) translateY(-2px)}}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 15px;font-weight:700;font-size:.85rem;transition:transform .2s var(--ease),border-color .2s}
.pill:hover{border-color:var(--accent)}
.pill:active{transform:scale(.95)}
.pill.wa{background:#25D366;border-color:#25D366;color:#06361b}

.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.seg button{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.85rem;font-weight:600;color:var(--muted);transition:background-color .25s,color .25s,border-color .25s}
.seg button.on{color:var(--fg);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cpeak{padding:0 16px 12px;font-size:.88rem}
.curve{padding:14px 12px 6px}
.curve svg text.ax{fill:var(--muted);font-size:12px;font-weight:600}
.curve svg text.vl{fill:var(--fg);font-size:13px;font-weight:700}
.pnote{margin:-4px 0 8px;font-size:.85rem}
.d .rain.mm{color:var(--muted)}
@media(max-width:520px){.bar{gap:6px}.btn{padding:9px 10px}#lang{font-size:.85rem}}

.nightov{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.5s;background:rgba(4,9,26,.58)}
body.isnight .nightov{opacity:1}
body.isnight[data-sky=snow],body.isnight[data-sky=fog]{--fg:#eaf1ff;--muted:#a7b9d8;--panel:rgba(12,22,50,.6);--line:rgba(234,241,255,.16);--accent:#8fc2ff;--cloud:rgba(120,140,190,.25)}
body.isnight[data-sky=snow]{--barbg:#27344a}body.isnight[data-sky=fog]{--barbg:#262d3a}
body.isnight[data-sky=rain]{--barbg:#1b2733}body.isnight[data-sky=storm]{--barbg:#10131f}
body.isnight .clouds{opacity:.3}
body.isnight[data-sky=fog] .fog i{opacity:.22;background:radial-gradient(closest-side,rgba(150,170,210,.55),transparent)}

/* ---- village background ---- */
body{--vh1:#a9d9e0;--vh2:#79c096;--vg1:#56ad6c;--vg2:#68bd7c;--vlf:#2f8f4c;--vlf2:#49ab5f;--vtk:#7b5a3a;--vwl:#f0dcb0;--vrf:#b9573b;--vrf2:#cfae63;--vdr:#6b4a2e;--vwn:#4a6a88;--vwg:0;--vr1:#7accf2;--vr2:#3f9bd8;--vrw:rgba(255,255,255,.6);--vbt:#6e4627;--vbs:#e2b44c;--vsl:#fbf3dc;--vsm:rgba(255,255,255,.75);--vks:#f7f4ea;--vff:0;--vrip:0}
body[data-sky=cloud]{--vh1:#b3c8c8;--vh2:#8fae9c;--vg1:#6f9a7d;--vg2:#7ba888;--vlf:#52805f;--vlf2:#64926f;--vwl:#ddd0b8;--vrf:#9a6753;--vrf2:#b59a64;--vr1:#a6bfcd;--vr2:#7599b1;--vrw:rgba(255,255,255,.5);--vwg:.12}
body[data-sky=rain]{--vh1:#7c9496;--vh2:#5d7d71;--vg1:#4a6b5e;--vg2:#547567;--vlf:#335a47;--vlf2:#406a54;--vwl:#c3b497;--vrf:#74504a;--vrf2:#9a8657;--vwn:#4a5a6a;--vwg:.45;--vr1:#7392a6;--vr2:#4a6a82;--vrw:rgba(225,240,255,.55);--vsm:rgba(230,236,242,.6);--vks:#dcdccf}
body[data-sky=storm]{--vh1:#566b77;--vh2:#415c5b;--vg1:#344d49;--vg2:#3d5854;--vlf:#26433c;--vlf2:#2f4f46;--vwl:#a69b87;--vrf:#5a3f3e;--vrf2:#7d6e4a;--vwn:#3a4a5a;--vwg:.7;--vr1:#566f85;--vr2:#334c63;--vrw:rgba(210,225,250,.5);--vsm:rgba(200,205,220,.55);--vks:#b8bcb0}
body[data-sky=snow]{--vh1:#d5e2ee;--vh2:#e8f0f7;--vg1:#f2f7fb;--vg2:#ffffff;--vlf:#c5d6da;--vlf2:#e0ebee;--vtk:#6b5b4f;--vwl:#e4d8c5;--vrf:#f7fbff;--vrf2:#eef4fa;--vwn:#5a7690;--vwg:.35;--vr1:#bcd6e8;--vr2:#92b6d1;--vrw:rgba(255,255,255,.75);--vbs:#d9e6f2;--vsl:#fff;--vsm:rgba(255,255,255,.8);--vks:#fff}

  const w=LAST.w,st=hourStart(w),H=w.hourly,sl=a=>a.slice(st,st+24),m=S.metric,times=sl(H.time);
  let vals,kind="line",unit;
  if(m==="r"){vals=sl(H.precipitation_probability).map(x=>x??0);kind="bar";unit="%"}
  else if(m==="w"){vals=sl(H.wind_speed_10m).map(x=>x??0);unit=" "+wUnit()}
  else if(m==="h"){vals=sl(H.relative_humidity_2m).map(x=>x??0);unit="%"}
  else{vals=sl(H.temperature_2m);unit="°"}
  const mi=vals.indexOf(Math.max(...vals));
  $("cbox").innerHTML=chart(vals,kind,times)+`<div class="sub cpeak">${T("peak",Math.round(vals[mi])+unit,mi?t12(times[mi]):T("now"))}</div>`;
  $$("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  digits($("cbox"));
}
let prevT=null;
function countUp(el,from,to){if(RM||from===null||from===to){el.textContent=N(to);return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=N(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(f)})(t0)}
const same=(a,b)=>Math.abs(a.lat-b.lat)<.01&&Math.abs(a.lon-b.lon)<.01;
const mins=s=>+s.slice(11,13)*60+ +s.slice(14,16);

function alertFor(w,c,start){
  const h=w.hourly;
  if(c.weather_code>=95)return{cls:"storm",ic:"⛈️",txt:T("stormNow")};
  for(let i=1;i<=3;i++){const k=start+i;if(k<h.time.length&&h.weather_code[k]>=95)return{cls:"storm",ic:"⛈️",txt:T("stormAt",t12(h.time[k]))}}
  if((c.precipitation||0)>0.05||RAINY.includes(c.weather_code))return{cls:"now",ic:"🌧️",txt:T("rainNow")};
  for(let i=1;i<=6;i++){const k=start+i;if(k>=h.time.length)break;
    const p=h.precipitation_probability[k]??0,mm=h.precipitation[k]??0;
    if(p>=55||mm>=0.3)return{cls:"soon",ic:"☔",txt:i===1?T("rainSoon",p):T("rainAt",t12(h.time[k]),p)}}
  return null;
}

/* ---------- weather ---------- */
let first=true,token=0,ac=null,lastLoad=0;
const cacheKey=()=>S.place.lat.toFixed(2)+","+S.place.lon.toFixed(2)+","+(S.imp?1:0);
async function load(silent){
  const p=S.place,im=S.imp,id=++token;
  if(first){$("sk").hidden=false;$("out").hidden=true;$("msg").hidden=true}else if(!silent)$("out").classList.add("busy");
  if(ac)ac.abort();ac=new AbortController();const sg={signal:ac.signal};
  const u="&temperature_unit="+(im?"fahrenheit":"celsius")+"&wind_speed_unit="+(im?"mph":"kmh")+"&precipitation_unit="+(im?"inch":"mm");
  const ll="latitude="+p.lat+"&longitude="+p.lon;
  const wu="https://api.open-meteo.com/v1/forecast?"+ll+
   "&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,cloud_cover"+
   "&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,is_day,wind_speed_10m,relative_humidity_2m"+
   "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max"+
   "&timezone=auto&forecast_days=7"+u;
  const au="https://air-quality-api.open-meteo.com/v1/air-quality?"+ll+"&current=us_aqi,pm2_5,pm10&timezone=auto";
  const pu="https://api.open-meteo.com/v1/forecast?"+ll+"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&past_days=7&forecast_days=1&timezone=auto"+u;
  try{
    const [wr,ar,pr]=await Promise.allSettled([fetch(wu,sg),fetch(au,sg),fetch(pu,sg)]);
    if(wr.status!=="fulfilled"||!wr.value.ok)throw 0;
    const w=await wr.value.json();let aq=null,past=null;
    if(ar.status==="fulfilled"&&ar.value.ok)try{aq=(await ar.value.json()).current}catch{}
    if(pr.status==="fulfilled"&&pr.value.ok)try{past=(await pr.value.json()).daily}catch{}
    if(id!==token)return;
    LAST={k:cacheKey(),w,aq,past};lastLoad=Date.now();
    store.set("wc",{...LAST,t:lastLoad});
    render(w,aq,past);
  }catch(e){
    if(id!==token||(e&&e.name==="AbortError"))return;
    $("sk").hidden=true;$("out").classList.remove("busy");
    if(first&&!LAST)$("out").hidden=true;
    $("msg").hidden=false;
    $("msg").innerHTML=esc(T("err"))+` <button class="btn" id="retry">${esc(T("retry"))}</button>`;
    $("retry").onclick=()=>load();
  }
}

    hum:c.relative_humidity_2m,wind:Math.round(c.wind_speed_10m),wu:wUnit(),rain};

function render(w,aq,past){
  const p=S.place,c=w.current,im=S.imp,deg=im?"°F":"°C",dl=w.daily,code=c.weather_code;
  const [label,,sky]=info(code);
  const start=hourStart(w),H24=w.hourly.time.slice(start,start+24);
  const sl=a=>a.slice(start,start+24);
  const rain24=sl(w.hourly.precipitation).reduce((a,b)=>a+(b||0),0);
  const uv=Math.round(dl.uv_index_max[0]);
  const isFav=FAVS.some(f=>same(f,p));
  const tc=im?(c.apparent_temperature-32)*5/9:c.apparent_temperature,wk=im?c.wind_speed_10m*1.609:c.wind_speed_10m;
  const rainMax=Math.max(0,...sl(w.hourly.precipitation_probability).slice(0,12).map(x=>x||0));
  const nm=mins(c.time),srm=mins(dl.sunrise[0]),ssm=mins(dl.sunset[0]);
  const golden=Math.min(Math.abs(nm-srm),Math.abs(nm-ssm))<=45&&(sky==="clear"||code===2);
  setSky(code,c,golden,tc>=36&&c.is_day,wk,c.cloud_cover);
  const tips=[];
  if(rainMax>=50)tips.push(["☂️",T("tRain")]);
  if(uv>=8)tips.push(["🧴",T("tUv2")]);else if(uv>=6)tips.push(["🕶️",T("tUv1")]);
  if(tc>=36)tips.push(["💧",T("tHot")]);else if(tc<=10)tips.push(["🧥",T("tCold")]);
  if(wk>=40)tips.push(["💨",T("tWind")]);
  if(aq&&aq.us_aqi>150)tips.push(["😷",T("tAq")]);
  if(!tips.length)tips.push(["😊",T("tOk")]);
  const aqL=aq?AQ(aq.us_aqi):null;
  /* past days */
  let pastRows=[],cmp="";
  if(past&&past.time){
    const today=c.time.slice(0,10),idx=past.time.map((t,i)=>i).filter(i=>past.time[i]<today).slice(-7).reverse();
    pastRows=idx.map(i=>({d:past.time[i],hi:past.temperature_2m_max[i],lo:past.temperature_2m_min[i],r:past.precipitation_sum[i]||0,c:past.weather_code[i]})).filter(r=>r.hi!=null&&r.lo!=null);
    if(pastRows.length){const df=Math.round(dl.temperature_2m_max[0]-pastRows[0].hi);cmp=Math.abs(df)<1?T("cmpS"):df>0?T("cmpW",df):T("cmpC",-df)}
  }
  const allLo=[...dl.temperature_2m_min,...pastRows.map(r=>r.lo)],allHi=[...dl.temperature_2m_max,...pastRows.map(r=>r.hi)];
  const lo=Math.min(...allLo),hi=Math.max(...allHi),span=hi-lo||1;
  const track=(a,b)=>`<div class="track"><i style="left:${(a-lo)/span*100}%;width:${Math.max(6,(b-a)/span*100)}%"></i></div>`;
  const dayName=d=>new Date(d+"T12:00").toLocaleDateString(loc(),{weekday:"short",day:"numeric"});
  const moon=moonPhase(),dlen=ssm-srm,mt=moonTimes(c.time.slice(0,10),w.utc_offset_seconds||0,p.lat,p.lon);
  const stats=[[T("hum"),c.relative_humidity_2m+"%"],
    [T("wind"),`<span style="display:inline-block;transform:rotate(${c.wind_direction_10m+180}deg)">↑</span> ${Math.round(c.wind_speed_10m)} ${wUnit()} ${T("dirs")[Math.round(c.wind_direction_10m/45)%8]}`],
    [T("pres"),Math.round(c.pressure_msl)+" hPa"],[T("uv"),uv],[T("cloud"),c.cloud_cover+"%"],
    [T("rain24"),rain24.toFixed(im?2:1)+" "+(im?T("inch"):T("mm"))],[T("sunrise"),t12(dl.sunrise[0],1)],[T("sunset"),t12(dl.sunset[0],1)],
    [T("mrise"),mt.rise?t12(mt.rise,1):"–"],[T("mset"),mt.set?t12(mt.set,1):"–"],
    [moon.e+" "+moon.pct+"%",T("moon")+" · "+moon.n],[T("daylen"),T("dl",Math.floor(dlen/60),dlen%60)]];
  const al=alertFor(w,c,start);
  const pastTotal=pastRows.reduce((a,r)=>a+r.r,0),pastAvg=pastRows.length?Math.round(pastRows.reduce((a,r)=>a+r.hi,0)/pastRows.length):0;
  const ru=im?T("inch"):T("mm"),fm=v=>v<.05?"0":v.toFixed(im?2:1);
  const o=$("out");
  parkTabs();
  o.innerHTML=`
  <div class="hero">
    <div class="place"><span>${flag(p.cc)} ${esc(placeName(p))}${p.country?", "+esc(placeCountry(p)):""}</span><button id="fav" class="icon ${isFav?"on":""}" aria-label="${esc(T("save"))}" title="${esc(T("save"))}">${isFav?"★":"☆"}</button></div>
    <div class="temp"><span id="tn">${N(Math.round(c.temperature_2m))}</span><sup>${deg}</sup></div>
    <div class="cond"><span class="em">${icon(code,c.is_day)}</span>${esc(label)}</div>
    <div class="sub">${T("hilo",Math.round(dl.temperature_2m_max[0]),Math.round(dl.temperature_2m_min[0]),Math.round(c.apparent_temperature),deg)}</div>
    ${cmp?`<div class="sub">${cmp}</div>`:""}
    <div class="sub">${T("upd",t12(c.time,1))}</div>
    <div class="actions"><button id="wa" class="pill wa">💬 ${esc(T("share"))}</button><button id="rf" class="pill">⟳ ${esc(T("refresh"))}</button></div>
  </div>
  ${al?`<div class="alert ${al.cls}" role="alert"><span class="ai">${al.ic}</span><span>${esc(al.txt)}</span></div>`:""}
  <div class="grid">${stats.map(s=>`<div class="stat glass"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("")}</div>
  <div class="tips glass">${tips.map(t=>`<div class="tip"><span>${t[0]}</span><div>${t[1]}</div></div>`).join("")}</div>
  <div id="tabslot"></div>
  <h2>${T("next24")}</h2>
  <div class="seg" id="seg">${["t","r","w","h"].map(m=>`<button data-m="${m}" class="${m===S.metric?"on":""}">${T("m_"+m)}</button>`).join("")}</div>
  <div class="curve glass" id="cbox"></div>
  <div class="hours">${H24.map((t,i)=>{const k=start+i;return `<div class="h glass"><div>${i?t12(t):T("now")}</div><div>${icon(w.hourly.weather_code[k],w.hourly.is_day[k])}</div><div>${Math.round(w.hourly.temperature_2m[k])}°</div><small>${w.hourly.precipitation_probability[k]??0}%</small></div>`}).join("")}</div>
  ${aq?`<h2>${T("aqh")}</h2><div class="aq glass"><div class="aqn" style="color:${aqL[1]}">${Math.round(aq.us_aqi)}</div><div><b>${aqL[0]}</b><div class="sub">PM2.5 ${Math.round(aq.pm2_5)} · PM10 ${Math.round(aq.pm10)} µg/m³</div><div class="meter"><i style="left:${Math.min(aq.us_aqi,300)/3}%"></i></div></div></div>`:""}
  <h2>${T("days7")}</h2>
  <div class="days glass">${dl.time.map((d,i)=>{const n=i?dayName(d):T("today"),a=dl.temperature_2m_min[i],b=dl.temperature_2m_max[i];
    return `<div class="d"><div>${n}</div><div>${icon(dl.weather_code[i])}</div><div class="rain">${dl.precipitation_probability_max[i]??0}%</div><div class="lo">${Math.round(a)}°</div>${track(a,b)}<div class="hi">${Math.round(b)}°</div></div>`}).join("")}</div>
  ${pastRows.length?`<h2>${T("past7")}</h2><div class="sub pnote">${T("pnote")} (${ru}) · ${T("psum",pastTotal.toFixed(im?2:1)+" "+ru,pastAvg)}</div>
  <div class="days glass">${pastRows.map((r,i)=>`<div class="d"><div>${i?dayName(r.d):T("yday")}</div><div>${icon(r.c)}</div><div class="rain mm">${fm(r.r)}</div><div class="lo">${Math.round(r.lo)}°</div>${track(r.lo,r.hi)}<div class="hi">${Math.round(r.hi)}°</div></div>`).join("")}</div>`:""}`;
  placeTabs(true);
  drawChart();
  const nt=Math.round(c.temperature_2m);
  digits(o);countUp($("tn"),prevT,nt);prevT=nt;
  $("sk").hidden=true;$("msg").hidden=true;o.hidden=false;o.classList.remove("busy");
  if(first){first=false;[...o.children].forEach((ch,i)=>ch.style.setProperty("--n",i));o.classList.add("intro");setTimeout(()=>o.classList.remove("intro"),1800)}
  document.title=N(T("title",nt,deg,placeName(p)));
  try{geoSync()}catch{}
}

let BDD=null,bdDiv="All",bdSort="az",bdQ="";
async function loadBD(force){
  if(!force&&BDD&&BDD.imp===S.imp&&Date.now()-BDD.t<6e5){drawBD();return}
  $("bdgrid").innerHTML=Array.from({length:12},(_,i)=>`<div class="sk s" style="--n:${i}"></div>`).join("");
  const la=BD.map(d=>d.lat).join(","),lo=BD.map(d=>d.lon).join(",");
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FDhaka&forecast_days=1&temperature_unit=${S.imp?"fahrenheit":"celsius"}`;
  try{
    const r=await fetch(url);if(!r.ok)throw 0;
    const j=await r.json(),arr=Array.isArray(j)?j:[j];
    BDD={t:Date.now(),imp:S.imp,time:arr[0].current.time,rows:BD.map((d,i)=>({...d,i,t:arr[i].current.temperature_2m,code:arr[i].current.weather_code,day:arr[i].current.is_day,hi:arr[i].daily.temperature_2m_max[0],lo:arr[i].daily.temperature_2m_min[0],rain:arr[i].daily.precipitation_probability_max[0]??0}))};
    drawBD();
  }catch{
    $("bdgrid").innerHTML=`<p id="msg2">${esc(T("bderr"))} <button class="btn" id="bdretry">${esc(T("retry"))}</button></p>`;
    $("bdretry").onclick=()=>loadBD(true);
  }
}
function drawBD(){
  const R=BDD.rows,deg=S.imp?"°F":"°C";
  const hot=[...R].sort((a,b)=>b.t-a.t)[0],cold=[...R].sort((a,b)=>a.t-b.t)[0],wet=[...R].sort((a,b)=>b.rain-a.rain)[0];
  const avg=R.reduce((a,b)=>a+b.t,0)/R.length;
  $("bdsum").innerHTML=[[T("hot"),dn(hot.n),Math.round(hot.t)+deg,hot],[T("cold"),dn(cold.n),Math.round(cold.t)+deg,cold],[T("wet"),dn(wet.n),wet.rain+"%",wet],[T("avg"),Math.round(avg)+deg,T("across"),null]]
    .map(s=>`<button class="sm glass" ${s[3]?`data-i="${s[3].i}"`:"disabled"}><span>${s[0]}</span><b>${esc(s[1])}</b> <span style="display:inline">${esc(s[2])}</span></button>`).join("");
  let L=R.filter(d=>(bdDiv==="All"||d.div===bdDiv)&&(d.n.toLowerCase().includes(bdQ)||dn(d.n).includes(bdQ)));
  const lc=S.lang==="bn"?"bn":"en";
  L.sort(bdSort==="hot"?(a,b)=>b.t-a.t:bdSort==="cold"?(a,b)=>a.t-b.t:bdSort==="rain"?(a,b)=>b.rain-a.rain||b.t-a.t:(a,b)=>dn(a.n).localeCompare(dn(b.n),lc));
  $("bdinfo").textContent=T("bdinfo",L.length,t12(BDD.time,1));
  $("bdgrid").innerHTML=L.length?L.map(d=>`<button class="dc glass" data-i="${d.i}"><b>${esc(dn(d.n))}</b><small>${esc(dn(d.div))}</small><div class="big"><span>${icon(d.code,d.day)}</span><span>${Math.round(d.t)}°</span></div><small>H ${Math.round(d.hi)}° L ${Math.round(d.lo)}° · 💧 ${d.rain}%</small></button>`).join(""):`<p class="sub">${esc(T("none"))}</p>`;
  digits($("bdsum"));digits($("bdinfo"));digits($("bdgrid"));
}

function parkTabs(){const n=document.querySelector(".tabs"),h=$("tabhost");if(n&&h&&n.parentNode!==h)h.appendChild(n)}
function placeTabs(force){const n=document.querySelector(".tabs"),sl=$("tabslot"),h=$("tabhost");if(!n||!h)return;
  const tgt=(S.tab==="w"&&sl&&(force||!$("out").hidden))?sl:h;if(n.parentNode!==tgt)tgt.appendChild(n);moveInd()}
function moveInd(){const b=document.querySelector(".tabs button.on"),i=$("ind");if(b){i.style.width=b.offsetWidth+"px";i.style.transform=`translateX(${b.offsetLeft}px)`}}
function show(t){S.tab=t;$("tw").hidden=t!=="w";$("tbd").hidden=t!=="bd";
  $$(".tabs button").forEach(b=>{const on=b.dataset.tab===t;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});

async function radarLoad(){
  const id=++RD.gen;

    const r=await fetch("https://api.rainviewer.com/public/weather-maps.json",{cache:"no-store"});

    const j=await r.json(),past=(j.radar&&j.radar.past)||[];

    RD.layers={};RD.host=j.host;RD.frames=past;RD.at=Date.now();

function rlayer(i){

async function radarPlay(){

  const ls=RD.frames.map((_,i)=>{const l=rlayer(i);if(!RD.map.hasLayer(l)){l.setOpacity(0);l.addTo(RD.map)}return l});
  await Promise.race([Promise.all(ls.map(l=>new Promise(r=>{if(!l._loading)r();else l.once("load",r)}))),new Promise(r=>setTimeout(r,5000))]);

  }else $("eqsum").innerHTML="";
  $("eqlist").innerHTML=R.length?R.slice(0,EQ.shown).map((r,i)=>
    `<button class="eqi glass" type="button" data-k="${i}"><div class="mag" style="background:${mc(r.m)}">${r.m.toFixed(1)}</div><div class="eqt"><b>${esc(r.pl||"—")}</b><small>${esc(ago(r.t))} · ${esc(T("gDepth"))} ${N(Math.round(r.dp))} ${esc(T("gKm"))} · ${esc(gdist(r.km))} ${esc(T("gFrom"))}${r.ts?" · 🌊 "+esc(T("gTsu")):""}</small></div></button>`).join("")+
    (R.length>EQ.shown?`<button class="btn" id="eqmore" type="button">${esc(T("gMore"))}</button>`:""):
    `<p class="sub">${esc(T(EQ.mode==="near"?"gNoneNear":"gNone"))}</p>`;
  digits($("eqinfo"));digits($("eqsum"));digits($("eqlist"));
  eqMapDraw(fit);
}
async function eqLoad(force,silent){
  const url=eqUrl(),id=++EQ.gen,c=EQ.cache[url];
  if(!force&&c&&Date.now()-c.t<3e5){EQ.rows=c.rows;EQ.loaded=true;eqDraw(EQ.fit);EQ.fit=false;return}
  if(!silent)$("eqlist").innerHTML=`<div class="sk s"></div><div class="sk s"></div>`;
  if(EQ.ac)EQ.ac.abort();EQ.ac=new AbortController();
  try{
    const r=await fetch(url,{signal:EQ.ac.signal});if(!r.ok)throw 0;
    const j=await r.json();
    const rows=eqParse(j);
    if(id!==EQ.gen)return;
    EQ.cache[url]={t:Date.now(),rows};EQ.rows=rows;EQ.loaded=true;eqDraw(EQ.fit);EQ.fit=false;
  }catch(e){
    if(id!==EQ.gen||(e&&e.name==="AbortError"))return;
    if(silent&&EQ.loaded)return;
    $("eqlist").innerHTML=`<p class="sub">${esc(T("gEqErr"))} <button class="btn" id="eqretry" type="button">${esc(T("retry"))}</button></p>`;
  }
}
function eqFocus(i){
  const r=EQ.rows[i];if(!r||!EQ.map)return;
  $("eqshe").classList.remove("big");$("eqexp").classList.remove("up");
  EQ.map.setView([r.lat,r.lon],Math.max(EQ.map.getZoom(),5),{animate:!RM});
  if(EQ.mk[i])EQ.mk[i].openPopup();
}
function eqSync(){
  if(!EQ.started)return;const k=pk(S.place);if(k===EQ.pkey)return;
  EQ.pkey=k;
  if(EQ.mode==="near"){EQ.fit=true;EQ.shown=25;eqLoad()}else if(EQ.loaded)eqDraw(false);
}
function eqSeg(){$$("#eqseg button").forEach(b=>b.classList.toggle("on",b.dataset.e===EQ.mode))}
$("eqseg").onclick=e=>{const b=e.target.closest("[data-e]");if(!b||b.dataset.e===EQ.mode)return;
  EQ.mode=b.dataset.e;store.set("eqm",EQ.mode);EQ.shown=25;EQ.fit=true;EQ.pkey=pk(S.place);eqSeg();eqLoad()};
$("eqlist").onclick=e=>{
  if(e.target.closest("#eqretry")){eqLoad(true);return}
  if(e.target.closest("#eqmore")){EQ.shown+=25;eqDraw(false);return}
  const b=e.target.closest("[data-k]");if(b)eqFocus(+b.dataset.k)};

/* ===== wiring ===== */
const TZ={key:"",gen:0,st:null,started:false};
function teaserShow(){
  const el=$("gteqs");
  if(TZ.st===null)el.textContent=T("gEqSub");
  else if(TZ.st==="none")el.textContent=T("gTzNone");
  else el.textContent=T("gTzLatest",TZ.st.m.toFixed(1),gdist(TZ.st.km),ago(TZ.st.t));
  digits(el);
}
async function teaserEq(){
  const p=S.place,id=++TZ.gen,url=eqUrl("near");TZ.key=pk(p);
  let rows;const c=EQ.cache[url];
  if(c&&Date.now()-c.t<3e5)rows=c.rows;
  else{try{const r=await fetch(url);if(!r.ok)throw 0;rows=eqParse(await r.json());EQ.cache[url]={t:Date.now(),rows}}catch{return}}
  if(id!==TZ.gen)return;
  TZ.st=rows.length?{m:rows[0].m,t:rows[0].t,km:hav(p.lat,p.lon,rows[0].lat,rows[0].lon)}:"none";
  teaserShow();
}
const OV={open:null,pushed:false};
const ovEl=n=>$(n==="rad"?"radsec":"eqsec");
function eqStart(){
  if(!EQ.started){EQ.started=true;EQ.pkey=pk(S.place);eqMapInit();EQ.fit=true;eqLoad()}
  else{EQ.pkey="";eqSync()}
}
function ovPlace(){const t=placeName(S.place)+(S.place.country?", "+placeCountry(S.place):"");$("radplace").textContent=t;$("eqplace").textContent=t}
async function ovOpen(n){
  if(OV.open)return;
  OV.open=n;ovPlace();ovEl(n).hidden=false;
  document.documentElement.classList.add("ovlock");document.body.classList.add("ovlock");
  try{history.pushState({ov:n},"");OV.pushed=true}catch{OV.pushed=false}
  const b=ovEl(n).querySelector("[data-close]");if(b)b.focus();
  try{await loadLeaflet()}catch{gmsg(n==="rad"?"radmsg":"eqmsg",esc(T("gNoLib")));return}
  if(OV.open!==n)return;
  if(n==="rad"){radarInit();if(RD.map&&RD.frames.length&&Date.now()-RD.at>3e5)radarLoad()}else eqStart();
  setTimeout(()=>{const m=n==="rad"?RD.map:EQ.map;if(m)m.invalidateSize()},60);
}
function ovClose(fromPop){
  if(!OV.open)return;
  const n=OV.open;OV.open=null;ovEl(n).hidden=true;
  document.documentElement.classList.remove("ovlock");document.body.classList.remove("ovlock");
  radarPause();
  if(!raf&&S.fx){lastT=0;raf=requestAnimationFrame(tick)}
  if(!fromPop&&OV.pushed){OV.pushed=false;try{history.back()}catch{}}else OV.pushed=false;
}
addEventListener("popstate",()=>{if(OV.open)ovClose(true)});
addEventListener("keydown",e=>{if(e.key==="Escape"&&OV.open)ovClose()});
$$("[data-close]").forEach(b=>b.onclick=()=>ovClose());
$("eqexp").onclick=()=>{const big=$("eqshe").classList.toggle("big");$("eqexp").classList.toggle("up",big)};
$("gtrad").onclick=()=>ovOpen("rad");
$("gteq").onclick=()=>ovOpen("eq");
function geoSync(){radarSync();eqSync();ovPlace();if(TZ.started&&pk(S.place)!==TZ.key){TZ.st=null;teaserShow();teaserEq()}}
function geoLang(){
  setPlayBtn();ovPlace();$$("[data-close]").forEach(b=>b.setAttribute("aria-label",T("gBack")));$("rctr").title=T("gCenter");$("rctr").setAttribute("aria-label",T("gCenter"));
  $("radnote").innerHTML=T("gRadNote");$("eqnote").innerHTML=T("gEqNote");
  digits($("radnote"));digits($("eqnote"));
  if(RD.frames.length)$("rtime").textContent=rtime(RD.idx);
  eqSeg();teaserShow();
  if(EQ.loaded)eqDraw(false);
}
new MutationObserver(()=>{applyBase(RD.map);applyBase(EQ.map)}).observe(document.body,{attributes:true,attributeFilter:["data-sky","class"]});
whenSeen($("geot"),()=>{TZ.started=true;teaserEq();loadLeaflet().catch(()=>{})});
setInterval(()=>{if(document.hidden||!OV.open)return;if(OV.open==="rad"&&RD.map&&!RD.playing)radarLoad();if(OV.open==="eq"&&EQ.started)eqLoad(true,true)},3e5);

{const bar=document.querySelector(".bar");let on=false;addEventListener("scroll",()=>{const v=scrollY>6;if(v!==on){on=v;bar.classList.toggle("scrolled",v)}},{passive:true})}
/* ---------- start ---------- */
applyLang();
size();buildVillage();fx("clear",{});
const cached=store.get("wc",null);
if(cached&&cached.w&&cached.k===cacheKey()){LAST={k:cached.k,w:cached.w,aq:cached.aq,past:cached.past};try{render(LAST.w,LAST.aq,LAST.past)}catch{LAST=null;first=true}}
load(!!LAST);
</script>
